<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dusk EPIC geometry gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #fafafa;
      color: #222;
    }
    .meta {
      color: #666;
      margin-bottom: 1.25rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
    }
    .card {
      margin: 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      padding: 0.75rem;
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #eee;
      background: #fff;
    }
    .caption {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>dusk EPIC geometry images</h1>
  <p class="meta">Generated from default EPIC detector geometry converted to STEP in CI.</p>
  <section class="grid">
<p>No rendered images were found for this run.</p>
  </section>
</body>
</html>
