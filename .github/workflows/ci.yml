name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DDUSK_BUILD_APPS=OFF
          -DDUSK_ENABLE_TESTS=ON
          -DDUSK_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --target unit_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage
        run: |
          lcov --capture --directory build/tests/CMakeFiles/unit_tests.dir --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/_deps/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.info
          fail_ci_if_error: false
          use_oidc: true

  build-and-gallery:
    name: Build and render sample galleries (eic_xl)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8 # v5

      - name: Build and render galleries inside eic_xl container
        uses: eic/run-cvmfs-osg-eic-shell@bb99ea62f0bfff9dfc3c37396d7a5fcdf0801b56 # v1
        with:
          platform-release: "eic_xl:nightly"
          setup: /opt/detector/epic-main/bin/thisepic.sh
          run: |
            set -euo pipefail
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -- -j"$(nproc)"

            bash .github/scripts/fetch_nist_ctc.sh ci/nist-ctc
            mkdir -p docs/reports/geometry-images

            python3 .github/scripts/render_nist_gallery.py \
              build/dusk \
              build/duskcut \
              ci/nist-ctc \
              docs/reports/geometry-images

            python3 .github/scripts/generate_geometry_gallery.py \
              docs/reports/geometry-images \
              docs/reports/geometry-images.html

            mkdir -p ci/epic-step docs/reports/epic-geometry-images
            : "${DETECTOR_PATH:=/opt/detector/epic-main}"
            export DETECTOR_PATH DETECTOR_CACHE=/opt/detector/epic-main/share/epic
            # Follow ePIC CI syntax so conversion behavior tracks upstream workflows.
            IFS=$' \n\t'
            declare -A detectors
            while IFS= read -r d; do detectors[$d]='-l 3'; done < <(npdet_to_step list "$DETECTOR_PATH/epic.xml" | sed '/world/d;s/.*(vol: \(.*\)).*/\1/g')
            detectors[EcalBarrelImaging]='-l 4'
            detectors[HcalBarrel]='-l 1'
            detectors[LFHCAL]='-l 2'
            detectors[OuterBarrelMPGDSubAssembly]='-l 4'
            npdet_to_step $(for d in ${!detectors[@]} ; do echo part ${detectors[$d]} $d ; done) -o ci/epic-step/epic-default "$DETECTOR_PATH/epic.xml" 2>&1 | sed '/TGeoMatrix::dtor/d'

            python3 .github/scripts/render_nist_gallery.py \
              build/dusk \
              build/duskcut \
              ci/epic-step \
              docs/reports/epic-geometry-images

            python3 .github/scripts/generate_geometry_gallery.py \
              docs/reports/epic-geometry-images \
              docs/reports/epic-geometry-images.html \
              --title "dusk ePIC geometry gallery" \
              --heading "dusk ePIC geometry images" \
              --meta "Generated from default ePIC detector geometry converted to STEP in CI."

      - name: Upload docs reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-reports
          path: docs/reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-and-gallery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download docs reports artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-reports
          path: docs/reports/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
