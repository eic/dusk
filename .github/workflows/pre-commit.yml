name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-pre-commit:
    runs-on: ubuntu-latest
    env:
      SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout PR head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        id: precommit
        shell: bash
        run: |
          set +e
          pre-commit run --all-files --show-diff-on-failure --color=always
          status=$?
          set -e

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit and push autofixes
        if: ${{ steps.precommit.outputs.changed == 'true' && env.SAME_REPO_PR == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply pre-commit fixes"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Enforce pre-commit result
        shell: bash
        run: |
          if [[ "${{ steps.precommit.outputs.changed }}" == "true" ]]; then
            if [[ "${SAME_REPO_PR}" == "true" ]]; then
              echo "Autofix commit pushed to PR branch."
              exit 0
            fi
            echo "pre-commit produced changes but cannot push autofixes for this event."
            exit 1
          fi

          if [[ "${{ steps.precommit.outputs.status }}" != "0" ]]; then
            exit "${{ steps.precommit.outputs.status }}"
          fi
